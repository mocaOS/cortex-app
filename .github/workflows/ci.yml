name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (errors only)
        # Smoke-test subset: real breakage (syntax errors, undefined names),
        # not style. Style/full ruff config is a follow-up (see v2.0 roadmap).
        run: ruff check --select E9,F63,F7,F82 .

      - name: Tests
        run: pytest -q

  slim-image:
    name: Slim image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slim backend image (no torch/docling)
        run: |
          docker build -f backend/Dockerfile.prod \
            --build-arg INSTALL_LOCAL_ML=false \
            -t cortex-backend-slim:ci backend/

      - name: Import smoke test
        # Catches any module-level import that sneaks back into the base
        # dependency set (torch, docling, sentence-transformers).
        run: |
          docker run --rm \
            -e USE_OPENAI_EMBEDDINGS=true \
            cortex-backend-slim:ci \
            python -c "import app.main; print('slim image imports OK')"

  cpu-torch-image:
    name: CPU-torch image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU-torch backend image
        # PREDOWNLOAD_MODELS=false keeps CI fast; the release build sets it true.
        run: |
          docker build -f backend/Dockerfile.prod \
            --build-arg TORCH_VARIANT=cpu \
            --build-arg PREDOWNLOAD_MODELS=false \
            -t cortex-backend-cpu:ci backend/

      - name: Assert CPU wheels and no CUDA payload
        run: |
          # docker-entrypoint.sh logs "fixing ownership" lines to stdout on every
          # start (no volume state carries over between --rm runs), so `tail -1`
          # isolates the actual command output before comparing it.
          torch_version=$(docker run --rm cortex-backend-cpu:ci python -c "import torch; print(torch.__version__)" | tail -1)
          echo "torch: $torch_version"
          case "$torch_version" in
            *+cpu) ;;
            *) echo "::error::expected a +cpu torch build, got $torch_version"; exit 1 ;;
          esac

          nvidia_count=$(docker run --rm cortex-backend-cpu:ci sh -c 'pip list --format=freeze | grep -c "^nvidia-" || true' | tail -1)
          echo "nvidia packages: $nvidia_count"
          [ "$nvidia_count" = "0" ] || { echo "::error::CUDA wheels leaked into the CPU image"; exit 1; }

      - name: Import smoke test
        run: |
          docker run --rm -e USE_OPENAI_EMBEDDINGS=true \
            cortex-backend-cpu:ci \
            python -c "import app.main; print('cpu image imports OK')"

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  scripts:
    name: Repo scripts (tests + version sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test scripts/*.test.mjs

      - name: Version sync
        run: node scripts/check-version-sync.mjs
